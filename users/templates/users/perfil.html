{% extends "base.html" %}
{% load static %}

{% block title %}Editar Perfil - BicoOw{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
<style>
    .profile-card {
        max-width: 600px;
        margin: 2rem auto;
        padding: 2rem;
        border-radius: 0.5rem;
        box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        background-color: var(--bs-white);
    }
    .profile-card h2 {
        margin-bottom: 1.5rem;
    }
    .form-label {
        font-weight: 500;
    }
</style>
{% endblock %}

{% block content %}
<div class="profile-card">
    <h2 class="text-center">Editar Perfil</h2>
    <form method="POST" action="{% url 'users:edit_profile' %}" novalidate>
        {% csrf_token %}
        <div class="mb-3">
            <label for="first_name" class="form-label">Nome</label>
            <input type="text" class="form-control" id="first_name" name="first_name" value="{{ user.first_name }}" required>
        </div>
        <div class="mb-3">
            <label for="last_name" class="form-label">Sobrenome</label>
            <input type="text" class="form-control" id="last_name" name="last_name" value="{{ user.last_name }}" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
        </div>
        <div class="d-flex justify-content-between">
            <a href="{% url 'users:user_profile' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-highlight">Salvar Alterações</button>
        </div>
    </form>
    {% if messages %}
    <div class="mt-4">
        {% for message in messages %}
        <div class="alert alert-info" role="alert">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
</div>
{% endblock %}
